# Provisioning sets the measured owner public key.
cvm-version: 0.15.1-rc.14@sha256:6f38091ce8624c0d674f82645f45ba66fa38bea37039cdc817d046fc853cc84e
cvm-network:
  inbound-ports: [443, 22]
cpus: 2
memory: 2048

shim:
  upstream-port: 8080
  authenticated: false
  paths:
    - /healthz
    # Owner calls arrive EHBP-sealed and signed by the measured owner key.
    - /owner/rpc
  origins:
    - https://console.tinfoil.sh
    - https://terminal.tinfoil.sh

networks:
  upstream:
    egress: open

attested-keys:
  - id: host-ssh
    key: ed25519
    uid: 0
    gid: 0

containers:
  - name: monitor
    image: "ghcr.io/tinfoilsh/confidential-agent-monitor@sha256:33943dad72b269408e0a24385ea015ad8649c631d1ff4455c2e8180c59d2b1d5"
    # The Monitor holds keys and tokens; root/cvm_admin also lets it launch namespaces.
    cvm_admin: true
    user: "0:0"
    keys: [host-ssh]
    ports: ["22:2223"]
    networks: [upstream]
    env:
      - MONITOR_OWNER_PUBLIC_KEY: ""
      - TINFOIL_STORAGE_BUCKET: ""
      - AWS_CONTAINER_CREDENTIALS_FULL_URI: ""
    secrets:
      - AWS_CONTAINER_AUTHORIZATION_TOKEN
    command:
      - -production
      - -connector-workers
      - -ssh-host-key
      - /run/tinfoil/keys/host-ssh/private_key.pem
      - -api
      - 0.0.0.0:8080
      - -listen
      - 0.0.0.0:2223
    read_only: true
    tmpfs:
      /tmp: rw,noexec,nosuid,nodev,size=64m
    restart: always
    healthcheck:
      test: ["CMD", "/monitor", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
