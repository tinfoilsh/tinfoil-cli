# An Ubuntu workspace with measured CVM-wide administrator access. Connect with
# native SSH through Monitor after attested disk unlock.
# Requires a CVM release with 10.254.0.0/24 alias support and host capability 5.
cvm-version: 0.15.1-rc.14@sha256:6f38091ce8624c0d674f82645f45ba66fa38bea37039cdc817d046fc853cc84e
# cpus: 32
# memory: 524288
# gpus: 8
cpus: 4
memory: 8192

networks:
  dev:
    # The host permits only the assigned Monitor after measured boot.
    egress: open

attested-keys:
  - id: host-ssh
    key: ecdsa-p256
  # Owner requests are EHBP-sealed to this per-boot key, relayed through Monitor.
  - id: sandbox-ehbp
    key: x25519

volumes:
  - name: workspace
    size: 30GiB
    # Persistent encrypted disk, opened by the volume key sent to the sealed owner API.
    exec: true
    # The pack is read-only, so a writable store is the volume layered over it.
    overlays:
      - model: nix
        source: nix/store
        target: store

models:
  - name: nix
    # The pack holds programs, not weights.
    exec: true
    repo: "nix/sandbox-toolchain@s0v9sdpa9d1ydjkkpm1877h7z7i7wy5s"
    mwp: "0c9f44f757bb7ca8d1750268057219907cfe46459e64a2bf410ef411d7b47154_87658479616_307c8726-fde5-55e1-bb1f-9c7e1b391f9c"

containers:
  - name: "workspace"
    image: "ghcr.io/tinfoilsh/confidential-agent-sandbox@sha256:a37ad20683e56e9b46b16a03b32db5423154d783b4df660e2ec138986e2ab310" # rewritten at release
    # runtime: nvidia
    # gpus: all
    restart: on-failure
    cvm_admin: true
    attestation: true
    stop_signal: SIGRTMIN+3
    stop_timeout: 120
    networks: [dev]
    keys: [host-ssh, sandbox-ehbp]
    models: [nix]
    persistent_volumes: [workspace:/mnt/disk, workspace:/nix]

    # Native SSH is also published through the Monitor reverse connection.
    # sshd accepts only the measured owner public key.
    ports:
      - '22:22'

    env:
      # The dashboard supplies public owner and resource bindings.
      - SANDBOX_OWNER_PUBLIC_KEY: ""
      - SANDBOX_INSTANCE_ID: ""
      - NO_MONITOR: ""

    tmpfs:
      /run: "rw,nosuid,nodev,mode=755"

    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

shim:
  # Owner access uses attested SSH through Monitor, so no public CA is needed.
  tls-mode: self-signed
  upstream-port: 8080
  authenticated: false
  paths:
    - /healthz
